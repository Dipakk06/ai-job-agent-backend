[project]
name = "ai-job-agent"
version = "0.1.0"
description = "AI job search, matching, tracking, dashboard, Google Sheets and Gmail automation agent."
requires-python = ">=3.11"
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "langchain-openai>=0.2.0",
  "firecrawl-py>=2.0.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.8.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "sqlalchemy>=2.0.0",
  "streamlit>=1.39.0",
  "gspread>=6.1.0",
  "google-auth>=2.35.0",
  "google-api-python-client>=2.149.0",
  "google-auth-oauthlib>=1.2.1",
  "apscheduler>=3.10.4",
  "langchain-groq>=1.1.3",
]

[project.scripts]
job-agent = "app.main:main"
job-dashboard = "app.dashboard:run"
job-scheduler = "app.scheduler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
